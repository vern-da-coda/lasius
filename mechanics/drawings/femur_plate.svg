<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Lasius Hexapod – Femur Side Plate (1:1 Millimeter CAD Vector Drawing)
  Source: 300 DPI flatbed scan (/cad/scans/scan.jpeg) with millimeter ruler reference
  Coordinate Origin (0, 0): Center of left (hip) servo pivot hole
  Dimensions:
    - Pivot-to-Pivot Distance (L_femur): 100.0 mm (X = 0.0 to X = 100.0)
    - Plate Width / End Diameter:        31.6 mm (End Radius R = 15.8 mm)
    - Total Plate Length:                131.6 mm (X = -15.8 to X = +115.8)
    - Servo Shaft / Bearing Holes (2x):  Ø 8.0 mm (r = 4.0 mm) at (0, 0) and (100, 0)
    - Servo Horn Bolt Circles (2x 4):    Ø 2.0 mm (r = 1.0 mm) on Ø 16.0 mm cross (±8.0 mm X/Y)
    - Central M3 Standoff Holes (2x):    Ø 3.0 mm (r = 1.5 mm) at (35, 0) and (65, 0)
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="170mm"
  height="75mm"
  viewBox="-35 -35 170 75"
>
  <defs>
    <style>
      .bg { fill: #141724; }
      .cut-outer { fill: rgba(52, 152, 219, 0.14); stroke: #38bdf8; stroke-width: 0.35; }
      .cut-hole { fill: #141724; stroke: #38bdf8; stroke-width: 0.30; }
      .centerline { stroke: #64748b; stroke-width: 0.18; stroke-dasharray: 2, 1; fill: none; }
      .dim-line { stroke: #94a3b8; stroke-width: 0.20; fill: none; }
      .dim-text { fill: #e2e8f0; font-family: monospace; font-size: 2.6px; text-anchor: middle; }
      .title-text { fill: #38bdf8; font-family: monospace; font-size: 3.0px; font-weight: bold; }
    </style>
  </defs>

  <!-- Dark Studio CAD Background -->
  <rect class="bg" x="-35" y="-35" width="170" height="75" />

  <!-- Title Header -->
  <text class="title-text" x="-30" y="-28">LASIUS HEXAPOD — FEMUR SIDE PLATE (1:1 MM CAD)</text>

  <!-- Layer 1: 1:1 CNC / Laser Cut Geometry (Origin at Hip Pivot X=0, Y=0) -->
  <g id="CAD_CUT_GEOMETRY">
    <!-- Outer Stadium Contour: L_total = 131.6 mm, H = 31.6 mm (R = 15.8 mm) -->
    <path
      class="cut-outer"
      d="M 0,-15.8 L 100,-15.8 A 15.8,15.8 0 0 1 100,15.8 L 0,15.8 A 15.8,15.8 0 0 1 0,-15.8 Z"
    />

    <!-- Left Pivot (Hip, X = 0, Y = 0): Ø8.0 mm Hub + 4x Ø2.0 mm Horn Mounts (±8.0 mm) -->
    <circle class="cut-hole" cx="0" cy="0" r="4.0" />
    <circle class="cut-hole" cx="-8.0" cy="0" r="1.0" />
    <circle class="cut-hole" cx="8.0" cy="0" r="1.0" />
    <circle class="cut-hole" cx="0" cy="-8.0" r="1.0" />
    <circle class="cut-hole" cx="0" cy="8.0" r="1.0" />

    <!-- Central Standoff Holes (M3, Ø3.0 mm) at X = 35.0 mm and X = 65.0 mm -->
    <circle class="cut-hole" cx="35.0" cy="0" r="1.5" />
    <circle class="cut-hole" cx="65.0" cy="0" r="1.5" />

    <!-- Right Pivot (Knee, X = 100, Y = 0): Ø8.0 mm Hub + 4x Ø2.0 mm Horn Mounts (±8.0 mm) -->
    <circle class="cut-hole" cx="100.0" cy="0" r="4.0" />
    <circle class="cut-hole" cx="92.0" cy="0" r="1.0" />
    <circle class="cut-hole" cx="108.0" cy="0" r="1.0" />
    <circle class="cut-hole" cx="100.0" cy="-8.0" r="1.0" />
    <circle class="cut-hole" cx="100.0" cy="8.0" r="1.0" />
  </g>

  <!-- Layer 2: Centerlines & Reference Annotations -->
  <g id="CAD_DIMENSIONS">
    <!-- Longitudinal & Pivot Centerlines -->
    <line class="centerline" x1="-20" y1="0" x2="120" y2="0" />
    <line class="centerline" x1="0" y1="-19" x2="0" y2="19" />
    <line class="centerline" x1="35" y1="-6" x2="35" y2="6" />
    <line class="centerline" x1="65" y1="-6" x2="65" y2="6" />
    <line class="centerline" x1="100" y1="-19" x2="100" y2="19" />
    <!-- Bolt Circle Reference (Ø16.0 mm) -->
    <circle class="centerline" cx="0" cy="0" r="8.0" />
    <circle class="centerline" cx="100" cy="0" r="8.0" />

    <!-- Standoff Spacing Dimensions (Top) -->
    <line class="dim-line" x1="0" y1="-21" x2="100" y2="-21" />
    <line class="dim-line" x1="0" y1="-16.5" x2="0" y2="-22.5" />
    <line class="dim-line" x1="35" y1="-6.5" x2="35" y2="-22.5" />
    <line class="dim-line" x1="65" y1="-6.5" x2="65" y2="-22.5" />
    <line class="dim-line" x1="100" y1="-16.5" x2="100" y2="-22.5" />
    <text class="dim-text" x="17.5" y="-22.2">35.0 mm</text>
    <text class="dim-text" x="50.0" y="-22.2">30.0 mm</text>
    <text class="dim-text" x="82.5" y="-22.2">35.0 mm</text>

    <!-- Pivot-to-Pivot & Overall Length Dimensions (Bottom) -->
    <line class="dim-line" x1="0" y1="22" x2="100" y2="22" />
    <text class="dim-text" x="50" y="21.0">100.0 mm (Pivot-to-Pivot)</text>

    <line class="dim-line" x1="-15.8" y1="29" x2="115.8" y2="29" />
    <line class="dim-line" x1="-15.8" y1="2" x2="-15.8" y2="30.5" />
    <line class="dim-line" x1="115.8" y1="2" x2="115.8" y2="30.5" />
    <text class="dim-text" x="50" y="28.0">131.6 mm (Total Length, R=15.8 mm)</text>

    <!-- Plate Width Dimension (Left) -->
    <line class="dim-line" x1="-23" y1="-15.8" x2="-23" y2="15.8" />
    <line class="dim-line" x1="-2" y1="-15.8" x2="-24.5" y2="-15.8" />
    <line class="dim-line" x1="-2" y1="15.8" x2="-24.5" y2="15.8" />
    <text class="dim-text" x="-27.5" y="1.0" transform="rotate(-90 -27.5,1.0)">31.6 mm</text>

    <!-- Hole Specs Legend -->
    <text class="dim-text" x="50" y="35.5">Holes: 2x Ø8.0mm (Hubs) • 8x Ø2.0mm (BCD Ø16.0mm) • 2x Ø3.0mm (M3 Standoffs)</text>
  </g>
</svg>
