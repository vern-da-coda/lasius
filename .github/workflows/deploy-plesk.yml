name: Deploy Dashboard to Plesk

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: "plesk-deploy"
  cancel-in-progress: true

jobs:
  deploy-plesk:
    name: Build & Deploy to Plesk Webserver
    runs-on: ubuntu-latest
    environment:
      name: lasius.kaemmereit.de
      url: https://lasius.kaemmereit.de
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: software/lasius-dashboard/package-lock.json

      - name: Build Static Dashboard
        working-directory: software/lasius-dashboard
        run: |
          npm ci
          npm run build

      - name: Deploy to Plesk via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.PLESK_FTP_SERVER || secrets.PLESK_FTP_SERVER }}
          username: ${{ secrets.PLESK_FTP_USERNAME }}
          password: ${{ secrets.PLESK_FTP_PASSWORD }}
          local-dir: software/lasius-dashboard/dist/
          server-dir: ${{ vars.PLESK_SERVER_DIR || '/' }}
