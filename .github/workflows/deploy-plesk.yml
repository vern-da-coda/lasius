name: Deploy Dashboard to Plesk

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: "plesk-deploy"
  cancel-in-progress: true

jobs:
  deploy-plesk:
    name: Build & Deploy to Plesk Webserver
    runs-on: ubuntu-latest
    environment:
      name: lasius.kaemmereit.de
      url: https://lasius.kaemmereit.de
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: software/lasius-dashboard/package-lock.json

      - name: Build Static Dashboard
        working-directory: software/lasius-dashboard
        run: |
          npm ci
          npm run build

      - name: Deploy to Plesk via LFTP (FTPS)
        env:
          FTP_SERVER: ${{ vars.PLESK_FTP_SERVER || secrets.PLESK_FTP_SERVER }}
          FTP_USER: ${{ secrets.PLESK_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.PLESK_FTP_PASSWORD }}
          FTP_DIR: ${{ vars.PLESK_SERVER_DIR || '/' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set ftp:passive-mode true;
            mirror -R -a --delete --verbose software/lasius-dashboard/dist/ \"$FTP_DIR\";
            bye
          " -u "$FTP_USER","$FTP_PASSWORD" "$FTP_SERVER"
