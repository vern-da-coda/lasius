name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Automated Test Suite (Python 3.11, 3.12, 3.13)
  # ============================================================================
  python-tests:
    name: Python Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies & packages
        run: |
          python -m pip install --upgrade pip
          pip install -e software/lasius-core -e software/lasius-pilot pytest pytest-asyncio

      - name: Execute test suite (lasius-core & lasius-pilot)
        run: |
          pytest software/lasius-core/tests software/lasius-pilot/tests -v

  # ============================================================================
  # 2. Frontend Build Verification (Vue 3 / Vite SPA)
  # ============================================================================
  frontend-build:
    name: Frontend Build (Vue 3 / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: software/lasius-dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: software/lasius-dashboard
        run: npm ci

      - name: Build production bundle (Vite)
        working-directory: software/lasius-dashboard
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f software/lasius-dashboard/dist/index.html
          echo "✔ Static 3D Digital Twin bundle generated successfully."

  # ============================================================================
  # 3. Code Quality & Static Analysis
  # ============================================================================
  code-quality:
    name: Code Quality (Python, TypeScript, Shell)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 ruff

      - name: Python Syntax & Linter Check (flake8 & ruff)
        run: |
          # Check for Python syntax errors, undefined names, and critical issues
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          ruff check --select=E9,F63,F7,F82 software/lasius-core software/lasius-pilot

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: software/lasius-dashboard/package-lock.json

      - name: Install TypeScript tools
        working-directory: software/lasius-dashboard
        run: npm ci

      - name: TypeScript Static Typecheck (vue-tsc)
        working-directory: software/lasius-dashboard
        run: npx vue-tsc --noEmit

      - name: Shell Script Quality Check (shellcheck)
        run: |
          command -v shellcheck >/dev/null || (sudo apt-get update && sudo apt-get install -y shellcheck)
          shellcheck scripts/**/*.sh

  # ============================================================================
  # 4. Security & Vulnerability Auditing
  # ============================================================================
  security-scan:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python security scanners
        run: |
          python -m pip install --upgrade pip
          pip install -e software/lasius-core -e software/lasius-pilot bandit pip-audit

      - name: Python Dependency Vulnerability Scan (pip-audit)
        run: |
          # Audits Python packages against the PyPA Advisory Database
          pip-audit

      - name: Python Static Application Security Testing (Bandit)
        run: |
          # Scans for security flaws: injection, hardcoded credentials, unsafe calls
          bandit -r software/lasius-core/src software/lasius-pilot/src -s B104,B110,B404,B603,B606,B607

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: software/lasius-dashboard/package-lock.json

      - name: Node.js Dependency Security Audit (npm audit)
        working-directory: software/lasius-dashboard
        run: |
          # Checks for critical vulnerabilities in frontend dependencies
          npm audit --audit-level=critical

  # ============================================================================
  # 5. Documentation & Link Integrity
  # ============================================================================
  docs-integrity:
    name: Documentation & Link Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate Markdown cross-references
        run: python3 scripts/dev/check_links.py
