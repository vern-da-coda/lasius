# config.yaml
#
# Complete configuration for the Lasius Hexapod robot:
# 1. Physical robot geometry (leg segments, chassis dimensions, default stance)
# 2. Servo calibrations and PWM mapping (18 servos on two PCA9685 boards)

# ==============================================================================
# 1. Physical Robot Geometry
# ==============================================================================
geometry:
  # Leg segment lengths (distance between joint rotation axes in mm)
  limbs:
    coxa: 60.0    # Inner segment (Coxa)
    femur: 100.0  # Middle segment (Femur)
    tibia: 152.6  # Outer segment (Tibia v2 + straight Tarsus + compact Kufe sole)

  # Chassis dimensions (mount points for the Coxa servos in mm)
  chassis:
    width_front_rear: 130.0            # Distance between left & right coxa axes (front and rear)
    width_middle: 150.0                # Distance between left & right coxa axes (middle)
    axis_distance_longitudinal: 90.0   # Distance along Y-axis between front-to-middle and middle-to-rear

  # Default stance parameters (in mm) — v2 bionic ant stance (Femur +27.8 deg, Tibia 56.1 deg)
  default_stance:
    ground_clearance: 80.0             # Default body height above ground
    foot_radius_offset: 120.0          # Neutral foot radius from coxa joint
    default_x: 230.0                   # Default radial reach X in leg frame (angled Tibia for reliable Tarsus switch trigger)


# ==============================================================================
# 2. Closed-Loop Telemetry & ADC Feedback (Multiplexer 0x71 + 6x Wandler 0x48)
# ==============================================================================
telemetry:
  enabled: true
  mux_address: 0x71                    # PCA9548A/TCA9548A I2C address (A0 bridged to 3.3V)
  adc_address: 0x48                    # ADS1115 V280 I2C address per sub-bus (ADDR -> GND)
  poll_hz: 50.0                        # Closed-loop telemetry update rate [Hz]
  ema_alpha: 0.45                      # Exponential moving average factor for analog voltage smoothing
  tau_lag_s: 0.075                     # First-order servo transit dynamics lag constant tau [s]
  max_speed_deg_s: 350.0               # Reely NR-645 MG BB max unloaded slew rate at 6.0V (0.17s/60°)
  stall_error_deg: 8.0                 # Dynamic tracking error |Ist(t) - Expected(t)| threshold for stall detection [°]
  stall_timeout_s: 0.35                # Persistence time [s] before flagging a stalled/blocked joint
  foot_switch_threshold_v: 1.0         # ADS1115 A3 voltage threshold [V] (10k pull-up to 3.3V, COM->GND: <1.0V = contact)
  leg_mux_channels:
    left_front: 0
    left_middle: 1
    left_rear: 2
    right_front: 3
    right_middle: 4
    right_rear: 5


# ==============================================================================
# 3. Servo Calibration & Channel Mapping
# ==============================================================================
servos:
  # --- Left Side (Board 0x40) ---
  # Mechanical limits verified via 3D B-Rep workspace sweep (scripts/dev/check_workspace_collisions.py):
  #   - Hip (Femur): clear [-95°, +95°] -> soft limit [-90°, +90°]
  #   - Knee (Tibia): clear knee_bend [+19°, +122°] = tibia_angle [-71°, +32°] -> soft limit [-68°, +29°] (3° margin)
  #   - Coxa Yaw: chassis clear >= ±61°, adjacent legs clear ±26° counter-yaw -> [-25°, +25°] (front +35° forward for WAVE_HELLO)
  - name: "left_front_coxa"
    board_address: 0x40
    channel: 0
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -25  # Safe backward swing clear of middle leg (contact @ ±27°)
    max_angle: 35   # Forward swing clear of chassis (up to +61°) & WAVE_HELLO (+32°)
    orientation: 1
  - name: "left_front_femur"
    board_address: 0x40
    channel: 1
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -90
    max_angle: 90
    orientation: 1
  - name: "left_front_tibia"
    board_address: 0x40
    channel: 2
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -68  # 3° margin before mechanical extension stop (-72° / knee_bend +18°)
    max_angle: 29   # 3° margin before mechanical tuck stop (+33° / knee_bend +123°)
    orientation: 1

  - name: "left_middle_coxa"
    board_address: 0x40
    channel: 4
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -25  # Safe swing clear of adjacent legs (contact @ ±27°)
    max_angle: 25
    orientation: 1
  - name: "left_middle_femur"
    board_address: 0x40
    channel: 5
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -90
    max_angle: 90
    orientation: 1
  - name: "left_middle_tibia"
    board_address: 0x40
    channel: 6
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -68
    max_angle: 29
    orientation: 1

  - name: "left_rear_coxa"
    board_address: 0x40
    channel: 8
    center_offset_pulse: 440  # Stance calibration: +40° forward clockwise
    pulse_range: 2000
    min_angle: -25  # Safe swing backward towards chassis
    max_angle: 25   # Safe swing forward clear of middle leg
    orientation: 1  # Positive angle swings forward
  - name: "left_rear_femur"
    board_address: 0x40
    channel: 9
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -90
    max_angle: 90
    orientation: 1
  - name: "left_rear_tibia"
    board_address: 0x40
    channel: 10
    center_offset_pulse: -420  # Stance calibration: Outstretched knee extension (~+38°)
    pulse_range: 2000
    min_angle: -68
    max_angle: 29
    orientation: 1

  # --- Right Side (Board 0x42) ---
  - name: "right_front_coxa"
    board_address: 0x42
    channel: 0
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -25  # Safe backward swing clear of middle leg (contact @ ±27°)
    max_angle: 35   # Forward swing clear of chassis & WAVE_HELLO (+32°)
    orientation: -1 # Right side is often mirrored
  - name: "right_front_femur"
    board_address: 0x42
    channel: 1
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -90
    max_angle: 90
    orientation: -1
  - name: "right_front_tibia"
    board_address: 0x42
    channel: 2
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -68
    max_angle: 29
    orientation: -1

  - name: "right_middle_coxa"
    board_address: 0x42
    channel: 4
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -25  # Safe swing clear of adjacent legs (contact @ ±27°)
    max_angle: 25
    orientation: -1
  - name: "right_middle_femur"
    board_address: 0x42
    channel: 5
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -90
    max_angle: 90
    orientation: -1
  - name: "right_middle_tibia"
    board_address: 0x42
    channel: 6
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -68
    max_angle: 29
    orientation: -1

  - name: "right_rear_coxa"
    board_address: 0x42
    channel: 8
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -25  # Safe swing clear of adjacent legs (contact @ ±27°)
    max_angle: 25
    orientation: -1
  - name: "right_rear_femur"
    board_address: 0x42
    channel: 9
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -90
    max_angle: 90
    orientation: -1
  - name: "right_rear_tibia"
    board_address: 0x42
    channel: 10
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -68
    max_angle: 29
    orientation: -1
