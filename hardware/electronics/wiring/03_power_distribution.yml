# Lasius Hexapod - Power Distribution & Star Ground Architecture
# Bench Supply / 2S-3S LiPo (XT60BE-M), 25A Blade Fuse, Main Switch, Dual 6V Servo Rails, 5.1V Pi Logic & Central 3.3V Rail

options:
  fontname: "DejaVu Sans"

connectors:
  Power_Inlet_XT60:
    type: Amass XT60BE-M Chassis Inlet
    subtype: Bench Supply (6V-12V) or 2S/3S LiPo
    pincount: 2
    pinlabels: [BAT+, BAT-]
    color: YE
    notes: "Panel-mount rear power inlet (bench supply used during bring-up)"

  Inline_Fuse:
    type: Automotive Blade Fuse Holder
    subtype: 25A Fast-Acting Fuse
    pincount: 2
    pinlabels: [IN, OUT]
    color: OG

  Main_Switch:
    type: High-Current SPST Rocker Switch
    subtype: "20A DC Continuous Rating"
    pincount: 2
    pinlabels: [IN, OUT]
    color: RD

  Pos_Distribution:
    type: Switched V+ Distribution Bus
    subtype: High-Current Splice / Terminal
    pincount: 4
    pinlabels: [SW_IN+, FEED_UBEC_L+, FEED_UBEC_R+, FEED_PI_BUCK+]
    color: RD

  Star_Ground_Bus:
    type: Central Star-GND Busbar
    subtype: Common Reference Point
    pincount: 5
    pinlabels:
      - BAT_GND
      - UBEC_L_GND
      - UBEC_R_GND
      - PI_BUCK_GND
      - LOGIC_REF_GND
    color: BK
    notes: "Prevents ground bounce between high-current servo loads and ADC telemetry; 3.3V rail ties here via 1 single link"

  UBEC_Left:
    type: High-Current UBEC Left (6.0V)
    subtype: 10A-15A Step-Down (or Direct Bench 6V)
    pincount: 4
    pinlabels: [VIN+, GND_IN, VOUT_6V, GND_OUT]
    color: BU
    notes: "Dedicated rail for Left 9 servos + front aux"

  UBEC_Right:
    type: High-Current UBEC Right (6.0V)
    subtype: 10A-15A Step-Down (or Direct Bench 6V)
    pincount: 4
    pinlabels: [VIN+, GND_IN, VOUT_6V, GND_OUT]
    color: BU
    notes: "Dedicated rail for Right 9 servos + front aux"

  StepDown_Pi:
    type: Logic Buck Converter (5.1V 4.0A)
    subtype: Dedicated Raspberry Pi Regulator
    pincount: 4
    pinlabels: [VIN+, GND_IN, VOUT_5V1, GND_OUT]
    color: GN

  Controller_Left_Power:
    type: Controller Left Screw Terminal (PCA9685 0x40)
    subtype: V+ Servo Power Input
    pincount: 2
    pinlabels: [V+_6V, GND]
    color: BU

  Controller_Right_Power:
    type: Controller Right Screw Terminal (PCA9685 0x42)
    subtype: V+ Servo Power Input
    pincount: 2
    pinlabels: [V+_6V, GND]
    color: BU

  RaspberryPi_Power:
    type: Raspberry Pi 4 Power Input + 3.3V Feed
    subtype: 5V Header/USB-C In to Pin 1/17 3.3V Out
    pincount: 3
    pinlabels: [5V1_IN, GND, 3V3_PIN1_OUT]
    color: GN
    notes: "3.3V Pin 1/17 supplies ~60-100 mA sensor/logic rail (never feed 5V to logic boards)"

  Dist_3V3_GND_Rail:
    type: Central 3.3V / GND Distribution Rail
    subtype: Perfboard Busbar (100nF + 10uF Decoupling)
    pincount: 2
    pinlabels: [3V3_LOGIC_RAIL, GND_LOGIC_RAIL]
    color: RD
    notes: "Feeds 2x Controller VCC, 1x Multiplexer (0x71),\n6x Wandler (0x48) + planned IMU/ToF (~10-13 taps)"

cables:
  Inlet_to_Fuse:
    gauge: 14 AWG
    length: 0.05
    colors: [RD]
    wirecount: 1

  Fuse_to_Switch:
    gauge: 14 AWG
    length: 0.05
    colors: [RD]
    wirecount: 1

  Switch_to_PosBus:
    gauge: 14 AWG
    length: 0.05
    colors: [RD]
    wirecount: 1

  Inlet_to_StarGND:
    gauge: 14 AWG
    length: 0.08
    colors: [BK]
    wirecount: 1

  Supply_UBEC_Left:
    gauge: 16 AWG
    length: 0.08
    colors: [RD, BK]
    wirecount: 2

  Supply_UBEC_Right:
    gauge: 16 AWG
    length: 0.08
    colors: [RD, BK]
    wirecount: 2

  Supply_Pi_Buck:
    gauge: 18 AWG
    length: 0.08
    colors: [RD, BK]
    wirecount: 2

  Servo_Rail_Left:
    gauge: 16 AWG
    length: 0.12
    colors: [RD, BK]
    wirecount: 2

  Servo_Rail_Right:
    gauge: 16 AWG
    length: 0.12
    colors: [RD, BK]
    wirecount: 2

  Pi_5V_Rail:
    gauge: 20 AWG
    length: 0.10
    colors: [RD, BK]
    wirecount: 2

  Pi_3V3_Logic_Tap:
    gauge: 26 AWG
    length: 0.12
    colors: [RD]
    wirecount: 1

  Logic_StarGND_Ref:
    gauge: 24 AWG
    length: 0.12
    colors: [BK]
    wirecount: 1

connections:
  # Main Positive Path: XT60 Inlet -> 25A Fuse -> Master Switch -> V+ Distribution
  -
    - Power_Inlet_XT60: [BAT+]
    - Inlet_to_Fuse: [1]
    - Inline_Fuse: [IN]
  -
    - Inline_Fuse: [OUT]
    - Fuse_to_Switch: [1]
    - Main_Switch: [IN]
  -
    - Main_Switch: [OUT]
    - Switch_to_PosBus: [1]
    - Pos_Distribution: [SW_IN+]

  # Main Ground Path: XT60 Inlet -> Central Star Ground Busbar
  -
    - Power_Inlet_XT60: [BAT-]
    - Inlet_to_StarGND: [1]
    - Star_Ground_Bus: [BAT_GND]

  # Regulator Inputs from V+ Bus and Star Ground
  -
    - Pos_Distribution: [FEED_UBEC_L+]
    - Supply_UBEC_Left: [1]
    - UBEC_Left: [VIN+]
  -
    - Star_Ground_Bus: [UBEC_L_GND]
    - Supply_UBEC_Left: [2]
    - UBEC_Left: [GND_IN]

  -
    - Pos_Distribution: [FEED_UBEC_R+]
    - Supply_UBEC_Right: [1]
    - UBEC_Right: [VIN+]
  -
    - Star_Ground_Bus: [UBEC_R_GND]
    - Supply_UBEC_Right: [2]
    - UBEC_Right: [GND_IN]

  -
    - Pos_Distribution: [FEED_PI_BUCK+]
    - Supply_Pi_Buck: [1]
    - StepDown_Pi: [VIN+]
  -
    - Star_Ground_Bus: [PI_BUCK_GND]
    - Supply_Pi_Buck: [2]
    - StepDown_Pi: [GND_IN]

  # Regulated Outputs to Controller Left (0x40), Controller Right (0x42), Raspberry Pi 4, and 3.3V Logic Rail
  -
    - UBEC_Left: [VOUT_6V, GND_OUT]
    - Servo_Rail_Left: [1, 2]
    - Controller_Left_Power: [V+_6V, GND]
  -
    - UBEC_Right: [VOUT_6V, GND_OUT]
    - Servo_Rail_Right: [1, 2]
    - Controller_Right_Power: [V+_6V, GND]
  -
    - StepDown_Pi: [VOUT_5V1, GND_OUT]
    - Pi_5V_Rail: [1, 2]
    - RaspberryPi_Power: [5V1_IN, GND]
  -
    - RaspberryPi_Power: [3V3_PIN1_OUT]
    - Pi_3V3_Logic_Tap: [1]
    - Dist_3V3_GND_Rail: [3V3_LOGIC_RAIL]
  -
    - Star_Ground_Bus: [LOGIC_REF_GND]
    - Logic_StarGND_Ref: [1]
    - Dist_3V3_GND_Rail: [GND_LOGIC_RAIL]
