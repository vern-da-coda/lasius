# Lasius Hexapod - I2C Bus Topology (Primary Actuation & Multiplexed Sensor Bus)
# Raspberry Pi 4 -> 2x PCA9685 (0x40, 0x42) & TCA9548A Multiplexer (0x71) -> 6x ADS1115 Leg ADCs (0x48)

options:
  fontname: "DejaVu Sans"

connectors:
  RaspberryPi_GPIO:
    type: Raspberry Pi 4 (40-Pin Header)
    subtype: Pins 1 (3.3V), 3 (SDA1), 5 (SCL1), 6 (GND)
    pincount: 4
    pinlabels: [3V3, GND, SDA1, SCL1]
    color: GN

  I2C_Primary_Hub:
    type: Primary I2C1 Bus Distribution
    subtype: 3.3V STEMMA QT / Header Busbar
    pincount: 4
    pinlabels: [3V3_BUS, GND_BUS, SDA_BUS, SCL_BUS]
    color: GY

  PCA9685_Left_I2C:
    type: PCA9685 Left Servo Driver
    subtype: I2C Logic Header (Addr 0x40)
    pincount: 4
    pinlabels: [VCC_3V3, GND, SDA, SCL]
    color: BU
    notes: "Default address 0x40; ALLCALL (0x70) disabled in software"

  PCA9685_Right_I2C:
    type: PCA9685 Right Servo Driver
    subtype: I2C Logic Header (Addr 0x42 via A1)
    pincount: 4
    pinlabels: [VCC_3V3, GND, SDA, SCL]
    color: BU
    notes: "Solder bridge A1 closed for 0x42; ALLCALL (0x70) disabled"

  TCA9548A_Mux:
    type: Adafruit TCA9548A 8-Ch Multiplexer
    subtype: Central Sensor Hub (Addr 0x71 via A0)
    pinlabels:
      - VIN_3V3
      - GND
      - SDA
      - SCL
      - CH0_3V3
      - CH0_GND
      - CH0_SDA
      - CH0_SCL
      - CH1_3V3
      - CH1_GND
      - CH1_SDA
      - CH1_SCL
      - CH2_3V3
      - CH2_GND
      - CH2_SDA
      - CH2_SCL
      - CH3_3V3
      - CH3_GND
      - CH3_SDA
      - CH3_SCL
      - CH4_3V3
      - CH4_GND
      - CH4_SDA
      - CH4_SCL
      - CH5_3V3
      - CH5_GND
      - CH5_SDA
      - CH5_SCL
    color: BU
    notes: "Solder bridge A0 closed for 0x71 (avoids 0x70 boot conflict). CH6 (INA228) and CH7 (VL53L4CD) reserved."

  ADS1115_LF: &ads_leg
    type: ADS1115 16-Bit ADC Breakout
    subtype: Left Front Leg (CH0, Addr 0x48)
    pincount: 4
    pinlabels: [VDD_3V3, GND, SDA, SCL]
    color: OG
    notes: "ADDR tied to GND on board for 0x48"

  ADS1115_LM:
    <<: *ads_leg
    subtype: Left Middle Leg (CH1, Addr 0x48)

  ADS1115_LR:
    <<: *ads_leg
    subtype: Left Rear Leg (CH2, Addr 0x48)

  ADS1115_RF:
    <<: *ads_leg
    subtype: Right Front Leg (CH3, Addr 0x48)

  ADS1115_RM:
    <<: *ads_leg
    subtype: Right Middle Leg (CH4, Addr 0x48)

  ADS1115_RR:
    <<: *ads_leg
    subtype: Right Rear Leg (CH5, Addr 0x48)

cables:
  Pi_to_PrimaryHub:
    gauge: 26 AWG
    length: 0.15
    colors: [RD, BK, BU, YE]
    wirecount: 4

  Bus_to_PCA_Left:
    gauge: 26 AWG
    length: 0.10
    colors: [RD, BK, BU, YE]
    wirecount: 4

  Bus_to_PCA_Right:
    gauge: 26 AWG
    length: 0.10
    colors: [RD, BK, BU, YE]
    wirecount: 4

  Bus_to_TCA9548A:
    gauge: 26 AWG
    length: 0.10
    colors: [RD, BK, BU, YE]
    wirecount: 4

  SubBus_CH0_LF: &stemma_leg_cable
    gauge: 28 AWG
    length: 0.20
    colors: [RD, BK, BU, YE]
    wirecount: 4

  SubBus_CH1_LM:
    <<: *stemma_leg_cable
    length: 0.10

  SubBus_CH2_LR:
    <<: *stemma_leg_cable
    length: 0.20

  SubBus_CH3_RF:
    <<: *stemma_leg_cable
    length: 0.20

  SubBus_CH4_RM:
    <<: *stemma_leg_cable
    length: 0.10

  SubBus_CH5_RR:
    <<: *stemma_leg_cable
    length: 0.20

connections:
  # Raspberry Pi 4 to Primary I2C1 Distribution Hub
  -
    - RaspberryPi_GPIO: [3V3, GND, SDA1, SCL1]
    - Pi_to_PrimaryHub: [1, 2, 3, 4]
    - I2C_Primary_Hub: [3V3_BUS, GND_BUS, SDA_BUS, SCL_BUS]

  # Primary I2C1 Devices: PCA9685 Left (0x40), PCA9685 Right (0x42), TCA9548A (0x71)
  -
    - I2C_Primary_Hub: [3V3_BUS, GND_BUS, SDA_BUS, SCL_BUS]
    - Bus_to_PCA_Left: [1, 2, 3, 4]
    - PCA9685_Left_I2C: [VCC_3V3, GND, SDA, SCL]
  -
    - I2C_Primary_Hub: [3V3_BUS, GND_BUS, SDA_BUS, SCL_BUS]
    - Bus_to_PCA_Right: [1, 2, 3, 4]
    - PCA9685_Right_I2C: [VCC_3V3, GND, SDA, SCL]
  -
    - I2C_Primary_Hub: [3V3_BUS, GND_BUS, SDA_BUS, SCL_BUS]
    - Bus_to_TCA9548A: [1, 2, 3, 4]
    - TCA9548A_Mux: [VIN_3V3, GND, SDA, SCL]

  # Isolated Multiplexer Sub-Buses (CH0-CH5) with 3.3V & GND to 6x Leg ADS1115 Boards
  -
    - TCA9548A_Mux: [CH0_3V3, CH0_GND, CH0_SDA, CH0_SCL]
    - SubBus_CH0_LF: [1, 2, 3, 4]
    - ADS1115_LF: [VDD_3V3, GND, SDA, SCL]
  -
    - TCA9548A_Mux: [CH1_3V3, CH1_GND, CH1_SDA, CH1_SCL]
    - SubBus_CH1_LM: [1, 2, 3, 4]
    - ADS1115_LM: [VDD_3V3, GND, SDA, SCL]
  -
    - TCA9548A_Mux: [CH2_3V3, CH2_GND, CH2_SDA, CH2_SCL]
    - SubBus_CH2_LR: [1, 2, 3, 4]
    - ADS1115_LR: [VDD_3V3, GND, SDA, SCL]
  -
    - TCA9548A_Mux: [CH3_3V3, CH3_GND, CH3_SDA, CH3_SCL]
    - SubBus_CH3_RF: [1, 2, 3, 4]
    - ADS1115_RF: [VDD_3V3, GND, SDA, SCL]
  -
    - TCA9548A_Mux: [CH4_3V3, CH4_GND, CH4_SDA, CH4_SCL]
    - SubBus_CH4_RM: [1, 2, 3, 4]
    - ADS1115_RM: [VDD_3V3, GND, SDA, SCL]
  -
    - TCA9548A_Mux: [CH5_3V3, CH5_GND, CH5_SDA, CH5_SCL]
    - SubBus_CH5_RR: [1, 2, 3, 4]
    - ADS1115_RR: [VDD_3V3, GND, SDA, SCL]
