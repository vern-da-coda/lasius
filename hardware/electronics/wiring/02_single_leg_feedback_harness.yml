# Lasius Hexapod - Single Leg Wiring & Potentiometer Feedback Harness
# 3x Reely NR-645 MG BB Servos, Omron D2F-L Foot Switch, ADS1115 ADC, 4x 100nF MLCC & 10k Pull-Up

options:
  fontname: "DejaVu Sans"

connectors:
  PCA9685_Leg_Block:
    type: PCA9685 4-Channel Header Block
    subtype: Channels 4k, 4k+1, 4k+2 (4k+3 Spare)
    pinlabels:
      - Coxa_PWM
      - Coxa_V+
      - Coxa_GND
      - Femur_PWM
      - Femur_V+
      - Femur_GND
      - Tibia_PWM
      - Tibia_V+
      - Tibia_GND
      - Spare_CH_PWM
      - Spare_CH_V+
      - Spare_CH_GND
    color: BU
    notes: "4th slot in each 4-channel block (CH3, CH7, CH11) remains free for front/aux servos"

  TCA9548A_SubBus:
    type: TCA9548A Sub-Channel Uplink (CHx)
    subtype: 4-Pin I2C + 3.3V Feed
    pinlabels: [3V3, GND, SDA, SCL]
    color: BU

  Servo_Coxa: &servo_template
    type: Reely NR-645 MG BB
    subtype: Modified 4-Wire Servo (Coxa)
    pinlabels: [PWM, V+, GND, POT_WIPER]
    color: GY
    notes: "Wiper voltage 0.88V-2.25V (1.563V @ 0 deg)"

  Servo_Femur:
    <<: *servo_template
    subtype: Modified 4-Wire Servo (Femur)

  Servo_Tibia:
    <<: *servo_template
    subtype: Modified 4-Wire Servo (Tibia)

  Foot_Sensor:
    type: Omron D2F-L Microswitch
    subtype: Tactile Foot Contact (Active-Low)
    pinlabels: [NO_SIG, COM_GND]
    color: BK

  ADS1115_Leg_Board:
    type: ADS1115 16-Bit ADC Breakout
    subtype: Leg Telemetry Module (Addr 0x48)
    pinlabels:
      - VDD_3V3
      - GND
      - SDA
      - SCL
      - ADDR
      - A0_Coxa
      - A1_Femur
      - A2_Tibia
      - A3_Foot
    color: OG
    notes: "ADDR bridged to GND (0x48). PGA Gain = 1 (+/-4.096V, 860 SPS)."

  Onboard_RC_Pullup:
    type: Passive Filter + Pull-Up Network
    subtype: Soldered Directly Under ADS1115 Header
    pinlabels:
      - C0_A0
      - C1_A1
      - C2_A2
      - C3_A3
      - R_PULLUP_A3
      - R_PULLUP_3V3
      - C_COMMON_GND
    color: YE
    notes: "4x 100nF 50V MLCC (A0..A3 to GND, fc ~ 636 Hz) + 1x 10kOhm Pull-Up (A3 to VDD_3V3)"

cables:
  Coxa_Power_PWM:
    gauge: 24 AWG
    length: 0.12
    colors: [OG, RD, BN]
    wirecount: 3

  Coxa_Pot_Line:
    gauge: 28 AWG
    length: 0.10
    colors: [WH]
    wirecount: 1

  Femur_Power_PWM:
    gauge: 24 AWG
    length: 0.20
    colors: [OG, RD, BN]
    wirecount: 3

  Femur_Pot_Line:
    gauge: 28 AWG
    length: 0.18
    colors: [WH]
    wirecount: 1

  Tibia_Power_PWM:
    gauge: 24 AWG
    length: 0.32
    colors: [OG, RD, BN]
    wirecount: 3

  Tibia_Pot_Line:
    gauge: 28 AWG
    length: 0.30
    colors: [WH]
    wirecount: 1

  Foot_Switch_Line:
    gauge: 28 AWG
    length: 0.35
    colors: [BU, BK]
    wirecount: 2

  SubBus_I2C_Feed:
    gauge: 28 AWG
    length: 0.20
    colors: [RD, BK, BU, YE]
    wirecount: 4

  Direct_Header_Solder:
    gauge: 26 AWG
    length: 0.01
    colors: [YE, YE, YE, YE, VT, RD, BK]
    wirecount: 7

connections:
  # I2C & 3.3V Supply from TCA9548A Multiplexer to Leg ADS1115
  -
    - TCA9548A_SubBus: [3V3, GND, SDA, SCL]
    - SubBus_I2C_Feed: [1, 2, 3, 4]
    - ADS1115_Leg_Board: [VDD_3V3, GND, SDA, SCL]

  # Coxa Servo PWM + Potentiometer Wiper
  -
    - PCA9685_Leg_Block: [Coxa_PWM, Coxa_V+, Coxa_GND]
    - Coxa_Power_PWM: [1, 2, 3]
    - Servo_Coxa: [PWM, V+, GND]
  -
    - Servo_Coxa: [POT_WIPER]
    - Coxa_Pot_Line: [1]
    - ADS1115_Leg_Board: [A0_Coxa]

  # Femur Servo PWM + Potentiometer Wiper
  -
    - PCA9685_Leg_Block: [Femur_PWM, Femur_V+, Femur_GND]
    - Femur_Power_PWM: [1, 2, 3]
    - Servo_Femur: [PWM, V+, GND]
  -
    - Servo_Femur: [POT_WIPER]
    - Femur_Pot_Line: [1]
    - ADS1115_Leg_Board: [A1_Femur]

  # Tibia Servo PWM + Potentiometer Wiper
  -
    - PCA9685_Leg_Block: [Tibia_PWM, Tibia_V+, Tibia_GND]
    - Tibia_Power_PWM: [1, 2, 3]
    - Servo_Tibia: [PWM, V+, GND]
  -
    - Servo_Tibia: [POT_WIPER]
    - Tibia_Pot_Line: [1]
    - ADS1115_Leg_Board: [A2_Tibia]

  # Tactile Foot Switch (Active-Low to GND)
  -
    - Foot_Sensor: [NO_SIG, COM_GND]
    - Foot_Switch_Line: [1, 2]
    - ADS1115_Leg_Board: [A3_Foot, GND]

  # Soldered Onboard 4x 100nF Low-Pass Capacitors (Ax -> GND) & 10k Pull-Up (A3 -> VDD_3V3)
  -
    - ADS1115_Leg_Board: [A0_Coxa, A1_Femur, A2_Tibia, A3_Foot, A3_Foot, VDD_3V3, GND]
    - Direct_Header_Solder: [1, 2, 3, 4, 5, 6, 7]
    - Onboard_RC_Pullup: [C0_A0, C1_A1, C2_A2, C3_A3, R_PULLUP_A3, R_PULLUP_3V3, C_COMMON_GND]
