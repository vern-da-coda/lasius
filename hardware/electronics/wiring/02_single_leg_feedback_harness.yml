# Lasius Hexapod - Single Leg Wiring & Potentiometer Feedback Harness
# 3x Reely NR-645 MG Servos, ADS1115 ADC, 100nF MLCC Low-Pass Filters & Foot Switch

connectors:
  PCA9685_Leg_Block:
    type: PCA9685 3x3 Pin Header (Channels N, N+1, N+2)
    pincount: 9
    pinlabels:
      - Coxa_PWM
      - Coxa_V+
      - Coxa_GND
      - Femur_PWM
      - Femur_V+
      - Femur_GND
      - Tibia_PWM
      - Tibia_V+
      - Tibia_GND
    color: BU

  Servo_Coxa:
    type: Reely NR-645 MG BB (Coxa Servo)
    pincount: 4
    pinlabels: [PWM, V+, GND, POT_WIPER]
    color: GY

  Servo_Femur:
    type: Reely NR-645 MG BB (Femur Servo)
    pincount: 4
    pinlabels: [PWM, V+, GND, POT_WIPER]
    color: GY

  Servo_Tibia:
    type: Reely NR-645 MG BB (Tibia Servo)
    pincount: 4
    pinlabels: [PWM, V+, GND, POT_WIPER]
    color: GY

  Foot_Sensor:
    type: Omron D2F-L Microswitch / Contact Sensor
    pincount: 2
    pinlabels: [SIG, GND]
    color: BK

  Filter_Array_100nF:
    type: 4x 100nF 50V MLCC Low-Pass Capacitors (Soldered on ADC pins)
    pincount: 4
    pinlabels: [C_A0_GND, C_A1_GND, C_A2_GND, C_A3_GND]
    color: YE

  ADS1115_Leg_Board:
    type: ADS1115 16-Bit ADC Breakout (0x48 on Mux CHx)
    pincount: 8
    pinlabels: [A0_Coxa, A1_Femur, A2_Tibia, A3_Foot, VDD_3V3, GND, SCL, SDA]
    color: OG

cables:
  Coxa_Power_PWM:
    gauge: 24 AWG
    length: 0.12
    colors: [OG, RD, BN]
    wirecount: 3

  Coxa_Pot_Line:
    gauge: 28 AWG
    length: 0.10
    colors: [WH]
    wirecount: 1

  Femur_Power_PWM:
    gauge: 24 AWG
    length: 0.20
    colors: [OG, RD, BN]
    wirecount: 3

  Femur_Pot_Line:
    gauge: 28 AWG
    length: 0.18
    colors: [WH]
    wirecount: 1

  Tibia_Power_PWM:
    gauge: 24 AWG
    length: 0.32
    colors: [OG, RD, BN]
    wirecount: 3

  Tibia_Pot_Line:
    gauge: 28 AWG
    length: 0.30
    colors: [WH]
    wirecount: 1

  Foot_Switch_Line:
    gauge: 28 AWG
    length: 0.35
    colors: [BU, BK]
    wirecount: 2

  Filter_Grounding:
    gauge: 26 AWG
    length: 0.02
    colors: [YE, YE, YE, YE]
    wirecount: 4

connections:
  -
    - PCA9685_Leg_Block: [Coxa_PWM, Coxa_V+, Coxa_GND]
    - Coxa_Power_PWM: [1, 2, 3]
    - Servo_Coxa: [PWM, V+, GND]
  -
    - Servo_Coxa: [POT_WIPER]
    - Coxa_Pot_Line: [1]
    - ADS1115_Leg_Board: [A0_Coxa]

  -
    - PCA9685_Leg_Block: [Femur_PWM, Femur_V+, Femur_GND]
    - Femur_Power_PWM: [1, 2, 3]
    - Servo_Femur: [PWM, V+, GND]
  -
    - Servo_Femur: [POT_WIPER]
    - Femur_Pot_Line: [1]
    - ADS1115_Leg_Board: [A1_Femur]

  -
    - PCA9685_Leg_Block: [Tibia_PWM, Tibia_V+, Tibia_GND]
    - Tibia_Power_PWM: [1, 2, 3]
    - Servo_Tibia: [PWM, V+, GND]
  -
    - Servo_Tibia: [POT_WIPER]
    - Tibia_Pot_Line: [1]
    - ADS1115_Leg_Board: [A2_Tibia]

  -
    - Foot_Sensor: [SIG, GND]
    - Foot_Switch_Line: [1, 2]
    - ADS1115_Leg_Board: [A3_Foot, GND]

  -
    - Filter_Array_100nF: [C_A0_GND, C_A1_GND, C_A2_GND, C_A3_GND]
    - Filter_Grounding: [1, 2, 3, 4]
    - ADS1115_Leg_Board: [A0_Coxa, A1_Femur, A2_Tibia, A3_Foot]
